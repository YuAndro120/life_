version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/db/sqlcgen
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: vector
            go_type: string
            nullable: true
          - db_type: vector
            go_type: string
