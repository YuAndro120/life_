# Каталог источников «Штиль». Правила (см. plan.md, раздел 16):
#   * Источники из реестров нежелательных организаций и иноагентов в каталог НЕ входят.
#   * Пока нет даты `legal_checked` (проверка по реестрам), источник не включится, даже при active: true.
#     Это же ограничение продублировано в БД (CHECK sources_active_requires_legal_check).
#   * Проверять перед добавлением и периодически после; дату обновлять при каждой проверке.
#
# Формат: kind = rss | gov | tg | site (site пока не поддерживается сборщиком).
#   gov — официальный источник (государственный орган или межправительственная организация): сюжет из него
#         публикуется и с одним источником. Остальным нужно ≥ 2 разных источника.
#   country — страна издания (RU, US, GB, EU), lang — язык (по умолчанию ru). Пересказ всегда по-русски.
#   Для tg достаточно handle, адрес превью t.me/s/<handle> подставится сам.
#
# Проверка 25.09.2026 (legal_checked: 2026-09-25) выполнена по: (1) списку нежелательных организаций
# (версия от 28.08.2026, 393 записи) и (2) списку иноагентов / СМИ-иноагентов; названия изданий в них не найдены.
# Ограничение проверки: официальные файлы Минюста (XLS) автоматически не скачивались, использованы их
# публикации; для юридически значимых решений проверьте на minjust.gov.ru.
sources:
  # --- Государственные органы: официальные сайты (Россия) ---
  - {kind: gov, handle: cbr, url: "https://www.cbr.ru/rss/RssNews", title: Банк России, topic_hint: economy, country: RU, active: true, legal_checked: 2026-09-25, note: "Официальный сайт государственного органа."}
  - {kind: gov, handle: government, url: "http://government.ru/all/rss/", title: Правительство России, topic_hint: law, country: RU, active: true, legal_checked: 2026-09-25, note: "Официальный сайт государственного органа."}

