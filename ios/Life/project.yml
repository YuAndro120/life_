name: Life
options:
  bundleIdPrefix: ru.andronov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Life:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Life
        LifeAPIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Onest.ttf
          - GolosText.ttf
          - Spectral-Medium.ttf
          - Spectral-SemiBold.ttf
          - Spectral-Italic.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.life
        TARGETED_DEVICE_FAMILY: "1"
        API_BASE_URL: "http://127.0.0.1:8080"
      configs:
        Release:
          API_BASE_URL: "https://api.life.invalid"
  LifeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Life
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.life.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Life:
    build:
      targets:
        Life: all
    test:
      targets:
        - LifeTests
