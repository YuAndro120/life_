name: Life
options:
  bundleIdPrefix: ru.andronov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Life:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.life
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Life
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  LifeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Life
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.life.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Life:
    build:
      targets:
        Life: all
    test:
      targets:
        - LifeTests
