name: Shtil
options:
  bundleIdPrefix: ru.andronov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shtil:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Штиль
        ShtilAPIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Onest.ttf
          - GolosText.ttf
          - Spectral-Medium.ttf
          - Spectral-SemiBold.ttf
          - Spectral-Italic.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.shtil
        TARGETED_DEVICE_FAMILY: "1"
        API_BASE_URL: "https://shtil.tech"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShtilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Shtil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.andronov.shtil.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shtil:
    build:
      targets:
        Shtil: all
    run:
      commandLineArguments:
        # Встроенные данные, без сервера. Чтобы ходить на настоящий сервер: снять галочку здесь
        # (Product → Scheme → Edit Scheme → Run → Arguments) и включить -shtilAPI с адресом Mac.
        "-shtilSource fixtures": true
        "-shtilAPI http://192.168.1.130:8080": false
    test:
      targets:
        - ShtilTests
