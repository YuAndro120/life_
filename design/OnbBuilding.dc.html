<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — собираем выпуск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2432D0}a:hover{color:#22211E}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F2F1EC; color: #22211E; font-family: 'Onest', -apple-system, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 54px 20px 34px 20px">
<div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #66655F"><span>Выпуск № 1</span><span>{{headRight}}</span></div>
<div style="margin-top: 30px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 104px; line-height: 0.85; font-weight: 700; letter-spacing: -0.07em; font-variant-numeric: tabular-nums">{{count}}</div>
<div style="font-size: 16px; color: #66655F">{{countLabel}}</div>
</div>
<div aria-live="polite" style="margin-top: 22px; display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #2432D0"><span style="{{pulseStyle}}"></span>{{status}}</div>
<div aria-hidden="true" style="margin-top: 20px; position: relative; width: 350px; height: 270px">
<sc-for list="{{slips}}" as="s" hint-placeholder-count="12">
<span style="{{s.style}}"></span>
</sc-for>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<span style="{{c.style}}">
<span style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: #66655F"><span>{{c.tag}}</span><span>{{c.merge}}</span></span>
<span style="font-size: 16px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; color: #22211E">{{c.title}}</span>
</span>
</sc-for>
</div>
<ol style="list-style: none; margin: 22px 0 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.3">
<span style="{{st.dot}}"><sc-if value="{{st.done}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F2F1EC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
<span style="{{st.textStyle}}">{{st.text}}</span>
</li>
</sc-for>
</ol>
<div style="margin-top: auto; padding-top: 24px; min-height: 58px">
<sc-if value="{{done}}" hint-placeholder-val="{{ true }}">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 20px; border-radius: 18px; background: #22211E; color: #F2F1EC; font-size: 16px; font-weight: 500; text-decoration: none"><span>Открыть выпуск</span><span aria-hidden="true">→</span></a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._start = Date.now();
    this._iv = setInterval(() => {
      const t = Date.now() - this._start;
      this.setState({ t: t });
      if (t > 4800) clearInterval(this._iv);
    }, 50);
  }
  componentWillUnmount() {
    clearInterval(this._iv);
  }
  renderVals() {
    const t = (this.state && this.state.t) || 0;
    const N = 38;
    const clusterTop = [0, 97, 194];
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    let keptIdx = 0;
    let filtIdx = 0;
    let filteredDone = 0;
    let visible = 0;
    const slips = [];
    for (let i = 0; i < N; i++) {
      const filtered = ((i * 17) % N) < 19;
      const col = i % 4;
      const row = Math.floor(i / 4);
      const w = 44 + ((i * 37) % 36);
      let x = col * 89;
      let y = row * 27;
      let width = w;
      let color = '#8C8A83';
      let opacity = t > 100 + i * 28 ? 0.55 : 0;
      if (opacity > 0) visible++;
      let delay = 0;
      if (filtered) {
        const k = filtIdx++;
        if (t > 1600 + k * 50) { opacity = 0.1; color = '#A9A69C'; filteredDone++; }
        if (t > 2900) opacity = 0;
      } else {
        const j = keptIdx++;
        if (t > 1600) { color = '#22211E'; opacity = 0.8; }
        if (t > 2900) {
          const c = j < 9 ? 0 : (j < 15 ? 1 : 2);
          const within = j < 9 ? j : (j < 15 ? j - 9 : j - 15);
          x = 16;
          y = clusterTop[c] + 22 + within * 2;
          width = 240;
          delay = j * 22;
        }
        if (t > 3800) opacity = 0;
      }
      slips.push({ style: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + width + 'px; height: 10px; border-radius: 5px; background: ' + color + '; opacity: ' + opacity + '; transition: left 0.7s ' + ease + ' ' + delay + 'ms, top 0.7s ' + ease + ' ' + delay + 'ms, width 0.7s ' + ease + ' ' + delay + 'ms, opacity 0.4s ease, background 0.4s ease' });
    }
    const showCards = t > 3800;
    const stories = [
      { tag: 'Экономика / Факт', merge: '9 → 1', title: 'Банк России объявил решение по ставке' },
      { tag: 'ИИ / Факт', merge: '6 → 1', title: 'Вышла открытая модель с сильным русским' },
      { tag: 'Город / Решение', merge: '4 → 1', title: 'График отключения горячей воды' }
    ];
    const cards = stories.map((s, i) => Object.assign({}, s, {
      style: 'position: absolute; left: 0; top: ' + clusterTop[i] + 'px; width: 350px; height: 76px; box-sizing: border-box; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 18px; background: #FBFBFE; box-shadow: 0 1px 2px rgba(34,33,30,0.06), inset 0 0 0 1px #E2E0D8; opacity: ' + (showCards ? 1 : 0) + '; transform: translateY(' + (showCards ? 0 : 6) + 'px); transition: opacity 0.5s ease ' + (i * 120) + 'ms, transform 0.5s ' + ease + ' ' + (i * 120) + 'ms'
    }));
    let count;
    if (t < 1200) count = visible;
    else if (t < 1600) count = N;
    else if (t < 2900) count = N - filteredDone;
    else if (t < 3700) count = Math.max(3, Math.round(19 - 16 * (t - 2900) / 800));
    else count = 3;
    const status = t < 1200 ? 'Читаем источники' : t < 2600 ? 'Убираем рекламу и стоп-темы' : t < 3900 ? 'Склеиваем повторы' : t < 4400 ? 'Ищем законы про тебя' : 'Готово';
    const countLabel = t < 1600 ? 'постов из 12 источников' : t < 2900 ? 'осталось после фильтров' : 'сюжета в первом выпуске';
    const done = t > 4500;
    const stepDefs = [
      { at: 1200, text: 'Собрали 38 постов из 12 источников', blue: false },
      { at: 2600, text: 'Скрыли 19: реклама, стоп-темы, слухи', blue: false },
      { at: 3900, text: 'Склеили повторы в 3 сюжета', blue: false },
      { at: 4400, text: 'Нашли 2 изменения в законах для тебя', blue: true }
    ];
    const steps = stepDefs.map((s) => {
      const ok = t > s.at;
      const fill = s.blue ? '#2432D0' : '#22211E';
      return {
        text: s.text,
        done: ok,
        dot: 'width: 22px; height: 22px; box-sizing: border-box; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.3s, border-color 0.3s; ' + (ok ? 'background: ' + fill + '; border: 0' : 'background: transparent; border: 1.5px solid #C9C7BF'),
        textStyle: 'transition: color 0.3s; color: ' + (ok ? (s.blue ? '#2432D0' : '#22211E') : '#A9A69C') + (s.blue && ok ? '; font-weight: 500' : '')
      };
    });
    const pulseOn = Math.floor(t / 400) % 2 === 0;
    return {
      count: String(count).padStart(2, '0'),
      countLabel: countLabel,
      status: status,
      headRight: done ? 'Готов' : 'Собираем',
      pulseStyle: 'width: 7px; height: 7px; border-radius: 50%; background: #2432D0; transition: opacity 0.35s; opacity: ' + (done ? 1 : (pulseOn ? 1 : 0.25)),
      slips: slips,
      cards: cards,
      steps: steps,
      done: done
    };
  }
}
</script>
</body>
</html>
