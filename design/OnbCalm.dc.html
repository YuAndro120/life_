<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Онбординг — что не показывать</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#2432D0}a:hover{color:#22211E}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #F2F1EC; color: #22211E; font-family: 'Onest', -apple-system, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; padding: 54px 20px 34px 20px">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #22211E"><a href="Onboarding.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #22211E; text-decoration: none">← Назад</a><span>02 / 03</span></div>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
<span style="height: 4px; border-radius: 999px; background: #22211E"></span>
<span style="height: 4px; border-radius: 999px; background: #22211E"></span>
<span style="height: 4px; border-radius: 999px; background: #C9C7BF"></span>
</div>
<h1 style="margin: 18px 0 0 0; font-size: 44px; line-height: 0.98; font-weight: 700; letter-spacing: -0.055em">Что тебе не показывать<span style="color: #2432D0">?</span></h1>
<p style="margin: 16px 0 0 0; font-size: 16px; line-height: 1.5; color: #66655F">Всё это можно поменять потом в фильтрах.</p>
<h2 style="margin: 32px 0 0 0; padding-bottom: 10px; border-bottom: 1px solid #D8D6CE; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase">01 — Скрыть темы</h2>
<div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{topics}}" as="item" hint-placeholder-count="7">
<button aria-pressed="{{item.pressed}}" onClick="{{item.toggle}}" style="{{item.style}}">{{item.label}}<sc-if value="{{item.on}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="opacity: 0.7">×</span></sc-if></button>
</sc-for>
</div>
<h2 style="margin: 32px 0 0 0; padding-bottom: 10px; border-bottom: 1px solid #D8D6CE; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase">02 — Тяжёлые новости</h2>
<div role="radiogroup" aria-label="Тяжёлые новости" style="display: flex; flex-direction: column">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 0; border: 0; border-bottom: 1px solid #D8D6CE; background: transparent; font: inherit; color: #22211E; text-align: left; cursor: pointer">
<span style="{{m.ring}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em">{{m.title}}</span><span style="font-size: 13px; color: #66655F">{{m.hint}}</span></span>
</button>
</sc-for>
</div>
<h2 style="margin: 32px 0 0 0; padding-bottom: 10px; border-bottom: 1px solid #D8D6CE; font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace; font-size: 11px; font-weight: 400; letter-spacing: 0.04em; text-transform: uppercase">03 — Тон</h2>
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; border-bottom: 1px solid #D8D6CE">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; font-weight: 500; letter-spacing: -0.01em">Без слухов и прогнозов</span><span style="font-size: 13px; color: #66655F">Только факты и официальные решения</span></div>
<button role="switch" aria-checked="{{strict.checked}}" aria-label="Без слухов и прогнозов" onClick="{{strict.toggle}}" style="flex-shrink: 0; width: 52px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: flex-end; cursor: pointer"><span style="{{strict.track}}"><span style="{{strict.knob}}"></span></span></button>
</div>
<div style="margin-top: auto; padding-top: 28px">
<a href="OnbTheme.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 58px; padding: 0 20px; border-radius: 18px; background: #22211E; color: #F2F1EC; font-size: 16px; font-weight: 500; text-decoration: none"><span>Дальше</span><span aria-hidden="true">→</span></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const hidden = st.hidden || { 'Политика': true, 'Криминал': true };
    const heavy = st.heavy || 'fold';
    const strict = st.strict === undefined ? true : st.strict;
    const base = 'display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; ';
    const on = base + 'border: 1px solid #22211E; background: #22211E; color: #F2F1EC';
    const off = base + 'border: 1px solid #C9C7BF; background: #FAF9F6; color: #22211E';
    const topics = ['Политика', 'Криминал', 'Происшествия', 'Катастрофы', 'Шоу-бизнес', 'Спорт', 'Криптовалюты'].map((label) => ({
      label: label,
      on: !!hidden[label],
      style: hidden[label] ? on : off,
      pressed: hidden[label] ? 'true' : 'false',
      toggle: () => this.setState({ hidden: Object.assign({}, hidden, { [label]: !hidden[label] }) })
    }));
    const ringOn = 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 7px solid #2432D0; flex-shrink: 0';
    const ringOff = 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #A9A69C; flex-shrink: 0';
    const modes = [
      { key: 'hide', title: 'Скрывать', hint: 'Не показывать совсем' },
      { key: 'fold', title: 'Сворачивать', hint: 'Одна нейтральная сводка в конце выпуска' },
      { key: 'show', title: 'Показывать', hint: 'Как обычные сюжеты' }
    ].map((m) => Object.assign({}, m, {
      checked: heavy === m.key ? 'true' : 'false',
      ring: heavy === m.key ? ringOn : ringOff,
      pick: () => this.setState({ heavy: m.key })
    }));
    const track = 'display: flex; align-items: center; width: 42px; height: 24px; box-sizing: border-box; padding: 2px; border: 1.5px solid #22211E; border-radius: 999px; transition: background 0.18s; ';
    const knob = 'width: 17px; height: 17px; border-radius: 50%; transition: transform 0.18s; ';
    return {
      topics: topics,
      modes: modes,
      strict: {
        checked: strict ? 'true' : 'false',
        track: track + (strict ? 'background: #22211E' : 'background: transparent'),
        knob: knob + (strict ? 'background: #F2F1EC; transform: translateX(18px)' : 'background: #22211E; transform: translateX(0)'),
        toggle: () => this.setState({ strict: !strict })
      }
    };
  }
}
</script>
</body>
</html>
